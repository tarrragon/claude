[project]
name = "claude-hooks"
version = "0.1.0"
description = "Claude Code hook system for book_overview_v1 project"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "pyyaml>=6.0",
]

[tool.pytest.ini_options]
pythonpath = [".."]
testpaths = ["tests", "../lib/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-m 'not wallclock'"
markers = [
    "wallclock: 以牆鐘逾時為判準的真實子程序測試，負載敏感，預設主套件排除；執行 uv run pytest -m wallclock",
    "integration: 以生產啟動方式（subprocess uv run）執行，涉及真實 git/檔案 I/O",
]
