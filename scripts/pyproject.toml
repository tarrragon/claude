[project]
name = "claude-scripts"
version = "0.1.0"
description = "Claude Code framework scripts test environment"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "pyyaml>=6.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "wallclock: 以牆鐘時序為判準的真實子程序測試，負載敏感；與 hooks/pyproject.toml 同名同義，手動執行 -m wallclock",
]
